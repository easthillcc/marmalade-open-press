<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marmalade, back cover</title>
<!--
  Marmalade Open Press, made by Marmalade (https://marmalade.family).
  Copyright (c) 2026 East Hill. MIT licence.

  A back cover in the Marmalade style: the wordmark in the middle, a line
  underneath. No @page size on purpose: Open Press prints A5 by default.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9mm;
    font-family: Georgia, "Times New Roman", serif;
  }
  .logo { width: 62%; display: block; }
  .line { font-size: 9pt; letter-spacing: .08em; color: #6b6b6b; margin: 0; }
  .url { position: absolute; bottom: 14mm; font: 7.5pt/1 Helvetica, Arial, sans-serif; letter-spacing: .12em; color: #9a9a9a; }
</style>
</head>
<body>
  <img class="logo" src="marmalade-logo.svg" alt="Marmalade">
  <p class="line">Printed in Devon</p>
  <div class="url">marmalade.family</div>
</body>
</html>
